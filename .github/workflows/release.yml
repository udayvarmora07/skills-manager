name: Release

# Controlled release path: tag -> build once -> attest -> publish the exact
# tested artifacts -> GitHub Release -> post-publish verification.
#
# Policy: first-party and third-party actions below are pinned to reviewed full
# commit SHAs with an inline version/date comment. The first-party pins are
# also listed here for quick review: checkout@v4 =
# 11d5960a326750d5838078e36cf38b85af677262, setup-python@v5 =
# a26af69be951a213d495a4c3e4e4022e16d87065, download-artifact@v4 =
# d3f86a106a0bac45b974a628896c90dbdf5c8093, and
# attest-build-provenance@v2 = 96b4a1ef7235a096b17240c259729fdd70c83d45 —
# reviewed 2026-09-15; re-verify SHAs before changing them. `push: tags: v*` plus a protected `release` environment gate who can
# publish. No long-lived PyPI token is stored: publishing uses PyPI Trusted
# Publishing (OIDC) via the release environment.

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', Path("pyproject.toml").read_text())
          if not match:
              raise SystemExit("package version is missing from pyproject.toml")
          version = match.group(1)
          if tag != "v" + version:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          PY
      - name: Install the pinned, hash-verified build toolchain
        # SEC-8: the backend is pinned in pyproject.toml (`setuptools==…`) and
        # this lock pins + hashes the outer toolchain, so the attested bytes do
        # not depend on whatever PyPI serves on the day of the release.
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
      - name: Build wheel and sdist once
        run: python3 -m build --no-isolation --wheel --sdist --outdir dist
      - name: Verify package data on the exact artifacts
        run: python3 check_package_data.py --dist-dir dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  verify:
    name: verify exact artifacts
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist
      - name: Package-data coverage on the exact artifacts
        run: python3 check_package_data.py --dist-dir dist
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Docs consistency
        run: python3 check_docs.py
      - name: Store smoke on a clean install of the wheel
        run: |
          python3 -m venv /tmp/release-venv
          /tmp/release-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
          SKILLS_MANAGER_DATA=$(mktemp -d) /tmp/release-venv/bin/python -m skillsmgr --help
          SKILLS_MANAGER_DATA=$(mktemp -d) /tmp/release-venv/bin/python -m skillsmgr create demo -d "Release smoke check"

  attest:
    name: attest build provenance
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 — 2026-09-15 reviewed
        with:
          subject-path: "dist/*"

  publish-testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: attest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 — 2026-07-29 reviewed
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 — 2026-07-29 reviewed
        with:
          attestations: true

  github-release:
    name: github release + local artifact verification
    runs-on: ubuntu-latest
    needs: publish-pypi
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist
      - name: Create GitHub Release with the exact artifacts
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3 — 2026-09-09 reviewed
        with:
          files: dist/*
      - name: Verify tag, package version, web assets, and hermetic CRUD
        # SEC-7: this job holds `contents: write` (it can push refs and create
        # or delete releases), so it must never execute code fetched from an
        # index: every install below is `--no-index` against the exact
        # artifacts this workflow built and attested. Post-publish verification
        # of the PyPI distribution lives in `postpublish-verify`, which has no
        # write token.
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(python3 -c 'import skillsmgr; print(skillsmgr.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$(python3 -c 'import re; print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml").read()).group(1))')"
          test -s skillsmgr/webui/static/vendor/vue.global.prod.js
          python3 -m venv /tmp/postpublish-venv
          /tmp/postpublish-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/postpublish-venv/bin/python -m skillsmgr --help
          SKILLS_MANAGER_DATA=$(mktemp -d) /tmp/postpublish-venv/bin/python -m skillsmgr create demo -d "Release smoke check"

  postpublish-verify:
    name: verify the published PyPI distribution
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Verify PyPI install and hermetic CRUD after publication
        # The only step that executes a distribution fetched from an index runs
        # here, with a read-only token (SEC-7): a poisoned index entry can no
        # longer reach a credential that can write repository contents.
        run: |
          python3 -m venv /tmp/pypi-verify-venv
          /tmp/pypi-verify-venv/bin/python -m pip install --no-deps "skill-control-plane==${GITHUB_REF_NAME#v}"
          /tmp/pypi-verify-venv/bin/python -m skillsmgr --help
          /tmp/pypi-verify-venv/bin/python -c "from pathlib import Path; import skillsmgr; p = Path(skillsmgr.__file__).parent / 'webui' / 'static' / 'vendor' / 'vue.global.prod.js'; assert p.is_file() and p.stat().st_size > 0, p"
          SKILLS_MANAGER_DATA=$(mktemp -d) /tmp/pypi-verify-venv/bin/python -m skillsmgr create demo -d "Post-publish smoke check"
