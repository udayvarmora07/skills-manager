name: CI

# Policy: third-party actions and reusable workflows below are pinned to
# reviewed full commit SHAs with a "# <version> — <date> reviewed" comment.
# First-party actions/* and github/* stay on moving tags by policy
# (actions/checkout@v4 = 11d5960a326750d5838078e36cf38b85af677262,
# actions/setup-python@v5 = a26af69be951a213d495a4c3e4e4022e16d87065,
# actions/setup-node@v4 = 49933ea5288caeca8642d1e84afbd3f7d6820020,
# actions/upload-artifact@v4, actions/download-artifact@v4 — all verified
# 2026-09-09; re-verify SHAs before changing them). `pull_request`
# runs in fork context with a read-only token; no `pull_request_target` is used.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python3 -m py_compile skillsmgr/*.py smoke_*.py tests/*.py check_*.py
      - name: Complexity budget ratchet
        run: python3 check_complexity.py
      - name: Unit tests (stdlib only, no deps)
        run: python3 -m unittest discover -s tests

  adversarial:
    name: adversarial security checks
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive/parser/search/concurrency contracts
        run: >-
          python3 -m unittest tests.test_archive_contracts
          tests.test_frontmatter_contracts tests.test_search_contracts
          tests.test_concurrency_contracts tests.test_path_safety
          tests.test_store_contracts tests.test_scope_contracts
      - name: Path/portability contracts (Windows separators on Linux)
        run: python3 -m unittest tests.test_ci_release_contracts.CrossPlatformContractTests

  package:
    name: package + release-artifact check
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging verification tool
        run: python3 -m pip install --disable-pip-version-check "build==1.2.2.post1"
      - name: Build wheel and sdist once
        run: python3 -m build --wheel --sdist --outdir dist
      - name: Package-data coverage on the exact release artifacts
        run: python3 check_package_data.py --dist-dir dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Store smoke on a clean install of the wheel
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
          SKILLS_MANAGER_DATA=$(mktemp -d) /tmp/smoke-venv/bin/python -m skillsmgr --help

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation/source consistency
        run: python3 check_docs.py

  xplat:
    name: cross-platform path/archive (py${{ matrix.python-version }} + ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q skillsmgr tests check_package_data.py smoke_store.py smoke_web.py browser_harness.py check_docs.py check_complexity.py
      - name: Path, archive, package-data contracts
        run: python -m unittest tests.test_path_safety tests.test_archive_contracts tests.test_package_data tests.test_ci_release_contracts.CrossPlatformContractTests

  browser:
    name: browser smoke and frontend syntax
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Store smoke
        run: python3 smoke_store.py
      - name: Web smoke
        run: python3 smoke_web.py
      - name: Frontend syntax
        uses: actions/setup-node@v4
        with:
          # Node >= 22 provides the global WebSocket the CDP probe uses.
          node-version: "22"
      - name: Frontend syntax and browser harness
        run: |
          node --check skillsmgr/webui/app.js
          node --check skillsmgr/webui/domain.js
          python3 browser_harness.py
