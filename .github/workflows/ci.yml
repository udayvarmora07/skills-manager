name: CI

# Policy: first-party, third-party, and reusable-workflow actions below are
# pinned to reviewed full commit SHAs with an inline version/date comment.
# The first-party pins are also listed here for quick review:
# checkout@v4 = 11d5960a326750d5838078e36cf38b85af677262,
# setup-python@v5 = a26af69be951a213d495a4c3e4e4022e16d87065,
# setup-node@v4 = 49933ea5288caeca8642d1e84afbd3f7d6820020,
# upload-artifact@v4 = ea165f8d65b6e75b540449e92b4886f43607fa02 — reviewed
# 2026-09-15; re-verify SHAs before changing them. `pull_request`
# runs in fork context with a read-only token; no `pull_request_target` is used.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-correctness:
    name: static correctness (undefined-name gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      # Ruff action v4.1.0 — reviewed 2026-09-22; keep the full SHA pin.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0 — 2026-09-22 reviewed
        with:
          version: "0.16.8"
          args: "check --output-format=github"
          src: >-
            skillsmgr tests smoke_store.py smoke_web.py browser_harness.py
            desktop_launcher.py check_complexity.py check_docs.py check_package_data.py
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python3 -m py_compile skillsmgr/*.py smoke_*.py tests/*.py check_*.py
      - name: Complexity budget ratchet
        run: python3 check_complexity.py
      - name: Unit tests (stdlib only, no deps)
        run: python3 -m unittest discover -s tests

  adversarial:
    name: adversarial security checks
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Archive/parser/search/concurrency contracts
        run: >-
          python3 -m unittest tests.test_archive_contracts
          tests.test_frontmatter_contracts tests.test_search_contracts
          tests.test_concurrency_contracts tests.test_path_safety
          tests.test_store_contracts tests.test_scope_contracts
      - name: Path/portability contracts (Windows separators on Linux)
        run: python3 -m unittest tests.test_ci_release_contracts.CrossPlatformContractTests

  package:
    name: package + release-artifact check
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Install the pinned, hash-verified build toolchain
        # SEC-8: same lock as the release path, so the artifacts CI verifies are
        # built by the same toolchain that produces the attested release bytes.
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
      - name: Build wheel and sdist once
        run: python3 -m build --no-isolation --wheel --sdist --outdir dist
      - name: Package-data coverage on the exact release artifacts
        run: python3 check_package_data.py --dist-dir dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — 2026-09-15 reviewed
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Store smoke on a clean install of the wheel
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
          SKILLS_MANAGER_DATA=$(mktemp -d) /tmp/smoke-venv/bin/python -m skillsmgr --help

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Documentation/source consistency
        run: python3 check_docs.py

  xplat:
    name: cross-platform path/archive (py${{ matrix.python-version }} + ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q skillsmgr tests check_package_data.py smoke_store.py smoke_web.py browser_harness.py check_docs.py check_complexity.py
      - name: Path, archive, package-data contracts
        run: python -m unittest tests.test_path_safety tests.test_archive_contracts tests.test_package_data tests.test_ci_release_contracts.CrossPlatformContractTests

  browser:
    name: browser smoke and frontend syntax
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — 2026-09-15 reviewed
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 — 2026-09-15 reviewed
        with:
          python-version: "3.12"
      - name: Store smoke
        run: python3 smoke_store.py
      - name: Web smoke
        run: python3 smoke_web.py
      - name: Frontend syntax
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 — 2026-09-15 reviewed
        with:
          # Node >= 22 provides the global WebSocket the CDP probe uses.
          node-version: "22"
      - name: Frontend syntax and browser harness
        run: |
          node --check skillsmgr/webui/app.js
          node --check skillsmgr/webui/domain.js
          python3 browser_harness.py
