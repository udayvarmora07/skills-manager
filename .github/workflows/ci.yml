name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python3 -m py_compile skillsmgr/*.py smoke_*.py tests/*.py check_*.py
      - name: Complexity budget ratchet
        run: python3 check_complexity.py
      - name: Install packaging verification tool
        run: python3 -m pip install --disable-pip-version-check "build==1.2.2.post1"
      - name: Package-data coverage
        run: python3 check_package_data.py --require-build
      - name: Unit tests (stdlib only, no deps)
        run: python3 -m unittest discover -s tests
      - name: Documentation/source consistency
        run: python3 check_docs.py
      - name: Store smoke
        run: python3 smoke_store.py
      - name: Web smoke
        run: python3 smoke_web.py
      - name: Frontend syntax
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check skillsmgr/webui/app.js
