<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Manager — Warm Instrument (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   WARM INSTRUMENT — token layer
   A design system as tokens, so every screen below inherits one source.
   Palette is the existing ivory/copper lineage, re-expressed with a real
   neutral ramp, a real type ramp, hairline structure, and no shadows on
   surfaces (shadows are reserved for things that genuinely float).
   ========================================================================== */

:root {
  /* --- type: one family for UI, one mono for identifiers and data --- */
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --t-display: 600 26px/1.18 var(--sans); letter-spacing: -0.021em;
  --t-title:   600 17px/1.30 var(--sans); letter-spacing: -0.014em;
  --t-head:    600 13.5px/1.35 var(--sans); letter-spacing: -0.006em;
  --t-body:    400 13px/1.55 var(--sans);
  --t-sm:      400 12px/1.45 var(--sans);
  --t-micro:   600 10.5px/1.3 var(--sans); letter-spacing: 0.075em;
  --t-num:     500 12px/1 var(--mono); font-variant-numeric: tabular-nums;
  --t-id:      500 12.5px/1.35 var(--mono); letter-spacing: -0.01em;

  /* --- space: 4px base, only the steps actually used --- */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px; --s9: 48px;

  /* --- radius: small and deliberate. 10px everywhere reads as "template". --- */
  --r-ctl: 4px;   /* inputs, buttons, chips */
  --r-panel: 6px; /* cards, panels */
  --r-sheet: 10px;/* dialogs */

  /* --- motion: 120ms on paint properties only. No transforms, no springs. --- */
  --ease: cubic-bezier(0.2, 0, 0.2, 1);
  --dur: 120ms;

  --rail-w: 210px;
  --pane-w: 392px;
}

/* --- light: warm paper, warm ink. Never pure white, never pure black. --- */
[data-theme="light"] {
  --bg:         #faf7f1;
  --surface:    #fffdf9;
  --surface-2:  #f3ede2;
  --surface-3:  #ece4d6;
  --ink:        #221f1a;
  --ink-2:      #4a443a;
  --ink-3:      #7a7263;
  --ink-4:      #a49a88;
  --line:       #e6dfd1;
  --line-2:     #d5cab6;
  --line-3:     #b9ac93;

  --accent:     #9e4415;      /* copper, darkened for AA on paper */
  --accent-ink: #ffffff;
  --accent-bg:  #f7ece3;
  --accent-line:#e4cbb6;

  --ok:   #4f6b32;   --ok-bg:   #eef1e6;   --ok-line:   #cfd9bd;
  --warn: #8a6111;   --warn-bg: #f7f0dd;   --warn-line: #e0d0a8;
  --err:  #97321f;   --err-bg:  #f8eae5;   --err-line:  #e5c6ba;
  --mute-state: #7a7263; --mute-bg: #f0eadf; --mute-line: #ddd4c2;

  --sel-bg: #f6ece2;
  --focus:  #9e4415;
  --shadow-sheet: 0 1px 2px rgba(60,45,25,.07), 0 12px 28px -8px rgba(60,45,25,.18);
  color-scheme: light;
}

/* --- dark: warm charcoal, not slate. Copper stays the only chromatic voice. --- */
[data-theme="dark"] {
  --bg:         #16130e;
  --surface:    #1d1913;
  --surface-2:  #241f18;
  --surface-3:  #2d271e;
  --ink:        #f2ece0;
  --ink-2:      #cfc6b6;
  --ink-3:      #a09783;
  --ink-4:      #736a59;
  --line:       #302a20;
  --line-2:     #443c2e;
  --line-3:     #5d5342;

  --accent:     #e08a4e;
  --accent-ink: #1a1209;
  --accent-bg:  #2c2118;
  --accent-line:#4d3722;

  --ok:   #9dbb74;   --ok-bg:   #222617;   --ok-line:   #37452a;
  --warn: #d9a441;   --warn-bg: #2a2314;   --warn-line: #453a1f;
  --err:  #e0775c;   --err-bg:  #2c1a15;   --err-line:  #4a2a20;
  --mute-state: #a09783; --mute-bg: #241f18; --mute-line: #3a3327;

  --sel-bg: #2a2018;
  --focus:  #e08a4e;
  --shadow-sheet: 0 1px 2px rgba(0,0,0,.4), 0 16px 32px -10px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font: var(--t-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { display: flex; flex-direction: column; overflow: hidden; }

/* Numbers are data. Tabular everywhere, so columns of them line up. */
.num, .meter-n, td, th, .chip-n, kbd { font-variant-numeric: tabular-nums; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

/* ========================================================================
   TOPBAR — 48px, hairline bottom. Identity left, global actions right.
   ====================================================================== */
.topbar {
  height: 48px; flex: 0 0 48px;
  display: flex; align-items: center; gap: var(--s4);
  padding: 0 var(--s4) 0 var(--s5);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: var(--s2); }
.brand-mark {
  width: 15px; height: 15px; border-radius: 2px;
  background: var(--accent); align-self: center; flex: none;
  /* a notch, not a logo */
  -webkit-mask: linear-gradient(#000,#000) 0 0/9px 9px no-repeat,
                linear-gradient(#000,#000) 9px 9px/6px 6px no-repeat;
          mask: linear-gradient(#000,#000) 0 0/9px 9px no-repeat,
                linear-gradient(#000,#000) 9px 9px/6px 6px no-repeat;
}
.brand-name { font: var(--t-head); letter-spacing: -0.01em; }
.brand-ver  { font: var(--t-num); font-size: 10.5px; color: var(--ink-4); }

.omni {
  flex: 1; max-width: 460px; height: 30px;
  display: flex; align-items: center; gap: var(--s2);
  padding: 0 var(--s2) 0 var(--s3);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  color: var(--ink-3); font: var(--t-sm);
}
.omni kbd {
  margin-left: auto; font: var(--t-num); font-size: 10.5px;
  padding: 2px 5px; border: 1px solid var(--line-2);
  border-radius: 3px; color: var(--ink-4); background: var(--surface);
}
.top-actions { margin-left: auto; display: flex; align-items: center; gap: var(--s1); }

/* ========================================================================
   CONTROLS
   ====================================================================== */
.btn {
  height: 28px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px;
  font: var(--t-head); font-weight: 500; font-size: 12px;
  color: var(--ink-2); background: transparent;
  border: 1px solid transparent; border-radius: var(--r-ctl);
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:hover { background: var(--surface-2); color: var(--ink); }
.btn-primary {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); font-weight: 600;
}
.btn-primary:hover { background: color-mix(in oklab, var(--accent) 88%, #000); color: var(--accent-ink); }
.btn-ghost { color: var(--ink-3); }
.btn-icon { width: 28px; padding: 0; justify-content: center; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.chip {
  height: 24px; padding: 0 8px;
  display: inline-flex; align-items: center; gap: 5px;
  font: var(--t-head); font-weight: 500; font-size: 11.5px;
  color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-ctl);
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chip:hover { border-color: var(--line-2); background: var(--surface-2); }
.chip[aria-pressed="true"], .chip.on {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.chip-n { font: var(--t-num); font-size: 10.5px; opacity: .62; }
.chip[aria-pressed="true"] .chip-n { opacity: .7; }

/* Status: square + colour + word. Never colour alone. */
.st {
  display: inline-flex; align-items: center; gap: 5px;
  font: var(--t-head); font-weight: 500; font-size: 11px;
  white-space: nowrap;
}
.st::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: currentColor; flex: none; }
.st-ok   { color: var(--ok); }
.st-warn { color: var(--warn); }
.st-err  { color: var(--err); }
.st-mute { color: var(--mute-state); }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  height: 19px; padding: 0 6px; border-radius: 3px;
  font: var(--t-head); font-weight: 500; font-size: 10.5px;
  border: 1px solid transparent; white-space: nowrap;
}
.p-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.p-err  { color: var(--err);  background: var(--err-bg);  border-color: var(--err-line); }
.p-mute { color: var(--ink-3); background: var(--surface-2); border-color: var(--line); }
.p-accent { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-line); }

.micro { font: var(--t-micro); text-transform: uppercase; color: var(--ink-4); }

/* ========================================================================
   SHELL — rail | pane | detail
   ====================================================================== */
.shell { flex: 1; display: grid; grid-template-columns: var(--rail-w) var(--pane-w) 1fr; min-height: 0; }
.shell.solo { grid-template-columns: var(--rail-w) 1fr; }

.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow-y: auto; padding: var(--s3) 0;
}
.rail-sec { padding: 0 var(--s3); margin-bottom: var(--s5); }
.rail-sec > .micro { display: block; padding: 0 var(--s2) var(--s2); }

.nav-i {
  width: 100%; height: 29px; padding: 0 var(--s2);
  display: flex; align-items: center; gap: var(--s2);
  border: 0; border-radius: var(--r-ctl); background: transparent;
  color: var(--ink-2); font: var(--t-body); font-size: 12.5px; text-align: left;
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav-i:hover { background: var(--surface-2); color: var(--ink); }
.nav-i.on { background: var(--sel-bg); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.nav-i svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .82; }
.nav-i .n { margin-left: auto; font: var(--t-num); font-size: 10.5px; color: var(--ink-4); }
.nav-i .n.attention { color: var(--warn); }

/* A scope row carries three facts and must not lie about any of them. */
.scope {
  width: 100%; padding: 5px var(--s2);
  display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s2);
  border: 0; border-radius: var(--r-ctl); background: transparent;
  text-align: left; cursor: pointer;
  transition: background var(--dur) var(--ease);
}
.scope:hover { background: var(--surface-2); }
.scope.on { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--accent); }
.scope-name { font: var(--t-head); font-size: 12.5px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.scope-name .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.scope-name .dot.absent { background: transparent; box-shadow: inset 0 0 0 1px var(--line-3); }
.scope-n { font: var(--t-num); font-size: 11px; color: var(--ink-3); align-self: center; }
.scope-n.over-n { color: var(--err); font-weight: 600; }
.scope-meta { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s2); }
.scope-path { font: var(--t-num); font-size: 10px; color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========================================================================
   PANE — the list
   ====================================================================== */
.pane { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.pane-bar {
  flex: none; padding: var(--s3) var(--s4);
  display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.pane-title { display: flex; align-items: baseline; gap: var(--s2); }
.pane-title h2 { margin: 0; font: var(--t-title); }
.pane-count { font: var(--t-num); font-size: 11px; color: var(--ink-3); }
.pane-bar .spacer { margin-left: auto; }

.rows { flex: 1; overflow-y: auto; }
.row {
  position: relative; width: 100%;
  display: grid; grid-template-columns: 1fr auto; gap: 1px var(--s2);
  padding: 7px var(--s4) 7px calc(var(--s4) - 2px);
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; cursor: pointer;
  transition: background var(--dur) var(--ease);
}
.row:hover { background: var(--surface); }
.row.on { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--accent); }
.row-name { font: var(--t-id); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-desc {
  grid-column: 1 / -1; font: var(--t-sm); color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row-meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.row-scope { font: var(--t-num); font-size: 10.5px; color: var(--ink-4); }

/* ========================================================================
   DETAIL
   ====================================================================== */
.detail { background: var(--surface); overflow-y: auto; min-width: 0; }
.detail-head { padding: var(--s5) var(--s7) var(--s4); border-bottom: 1px solid var(--line); }
.crumb { display: flex; align-items: center; gap: 7px; font: var(--t-sm); color: var(--ink-4); }
.crumb-sep { color: var(--line-3); }
.crumb-id { font: var(--t-num); font-size: 11px; color: var(--ink-3); }
.detail-head h1 { margin: var(--s2) 0 var(--s2); font: var(--t-display); }
.detail-sub { font: var(--t-body); color: var(--ink-2); max-width: 68ch; }
.detail-actions { display: flex; gap: var(--s1); margin-top: var(--s4); flex-wrap: wrap; }

/* Three columns, because the fact set is six. An auto-fit grid leaves an
   empty cell at every width that doesn't divide evenly, which reads as broken. */
.facts {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--r-panel); overflow: hidden;
  margin: var(--s5) 0;
}
@media (max-width: 760px) { .facts { grid-template-columns: repeat(2, 1fr); } }
.fact { background: var(--surface); padding: var(--s3) var(--s4); }
.fact dt { font: var(--t-micro); text-transform: uppercase; color: var(--ink-4); margin: 0 0 5px; }
.fact dd { margin: 0; font: var(--t-num); font-size: 14px; color: var(--ink); }
.fact dd small { font: var(--t-sm); font-family: var(--sans); color: var(--ink-3); margin-left: 4px; }

/* An instance is a row of facts you can act on. */
.instances { width: 100%; border-collapse: collapse; }
.instances th {
  font: var(--t-micro); text-transform: uppercase; color: var(--ink-4);
  text-align: left; padding: 0 var(--s3) var(--s2); font-weight: 600;
  border-bottom: 1px solid var(--line-2); white-space: nowrap;
}
.instances td { padding: 9px var(--s3); border-bottom: 1px solid var(--line); font: var(--t-sm); vertical-align: middle; }
.instances tr:hover td { background: var(--surface-2); }
.instances .c-name { font: var(--t-head); font-size: 12.5px; color: var(--ink); }
.instances .c-path { font: var(--t-num); font-size: 10.5px; color: var(--ink-4); }
.instances .c-num { font: var(--t-num); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.instances td:last-child, .instances th:last-child { text-align: right; }

.sec { margin: var(--s7) 0; }
.sec > h3 { margin: 0 0 var(--s3); font: var(--t-head); }

/* The Learn layer: a real explanation, attached to the term it explains. */
.learn {
  margin: var(--s4) 0; padding: var(--s3) var(--s4);
  background: var(--surface-2); border: 1px solid var(--line);
  border-left: 2px solid var(--accent); border-radius: 0 var(--r-panel) var(--r-panel) 0;
  font: var(--t-sm); color: var(--ink-2); max-width: 72ch;
}
.learn b { color: var(--ink); font-weight: 600; }
.learn code { font: var(--t-num); font-size: 11px; background: var(--surface-3); padding: 1px 4px; border-radius: 3px; color: var(--ink); }

.doc { max-width: 70ch; font: var(--t-body); color: var(--ink-2); }
.doc h4 { font: var(--t-head); font-size: 13px; color: var(--ink); margin: var(--s5) 0 var(--s2); }
.doc pre {
  font: var(--t-num); font-size: 11.5px; line-height: 1.65;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-panel); padding: var(--s3) var(--s4); overflow-x: auto; color: var(--ink-2);
}

/* ========================================================================
   OVERVIEW — the workspace that replaces the list on first paint
   ====================================================================== */
.ov { padding: var(--s7) var(--s7) var(--s9); max-width: 1180px; }
.ov-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s6); margin-bottom: var(--s6); flex-wrap: wrap; }
.ov-head h1 { margin: 0 0 6px; font: var(--t-display); }
.ov-head p { margin: 0; font: var(--t-body); color: var(--ink-3); max-width: 62ch; }

/* THE HERO. Not "a big number with a small label" — the one finding that
   changes what you do next, stated as evidence with a way to act on it. */
.ov-hero {
  border: 1px solid var(--line-2); border-radius: var(--r-panel);
  background: var(--surface); margin-bottom: var(--s5); overflow: hidden;
}
.ov-hero-top { padding: var(--s5) var(--s5) var(--s4); display: flex; align-items: flex-start; gap: var(--s6); flex-wrap: wrap; }
.ov-hero h2 { margin: 0 0 6px; font: var(--t-title); max-width: 30ch; }
.ov-hero h2 em { font-style: normal; color: var(--err); }
.ov-hero p { margin: 0; font: var(--t-body); color: var(--ink-3); max-width: 66ch; }
.ov-hero-fig { margin-left: auto; text-align: right; }
.ov-hero-fig .big { font: var(--t-num); font-size: 30px; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
.ov-hero-fig .cap { font: var(--t-micro); text-transform: uppercase; color: var(--ink-4); margin-top: 5px; }
.ov-hero-cta { display: flex; gap: var(--s2); padding: 0 var(--s5) var(--s5); flex-wrap: wrap; }

/* Budget bars against the window line — the actual evidence.
   The axis runs 0–125% so the 100% line sits at 80% of the track; otherwise
   111% and 121% both render as a full bar and the chart hides its own point. */
.budgets { border-top: 1px solid var(--line); }
.budget-axis {
  display: grid; grid-template-columns: 128px 1fr 96px; gap: var(--s4);
  padding: 7px var(--s5) 3px; position: relative;
}
.budget-axis span { grid-column: 2; position: relative; height: 13px; }
.budget-axis span::before {
  content: "100% of one context window";
  position: absolute; left: 80%; transform: translateX(-50%);
  font: var(--t-micro); text-transform: uppercase; color: var(--ink-4); white-space: nowrap;
}
.budget-axis span::after {
  content: ""; position: absolute; left: 80%; top: 11px; bottom: -3px;
  width: 1px; background: var(--line-3);
}
.budget {
  display: grid; grid-template-columns: 128px 1fr 96px;
  align-items: center; gap: var(--s4);
  padding: 7px var(--s5); border-bottom: 1px solid var(--line);
}
.budget:last-child { border-bottom: 0; }
.budget:hover { background: var(--surface-2); }
.budget-name { font: var(--t-head); font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
.budget-track { position: relative; height: 16px; }
.budget-fill { position: absolute; top: 3px; left: 0; height: 10px; background: var(--ok); border-radius: 2px; }
.budget-fill.over { background: var(--err); }
.budget-val { font: var(--t-num); font-size: 11.5px; color: var(--ink-2); text-align: right; }
.budget-val.over { color: var(--err); font-weight: 600; }
.budget-val .of { color: var(--ink-4); }

/* The attention queue: observed facts, ordered by cost, each actionable. */
.ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); align-items: start; }
.panel { border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); overflow: hidden; }
.panel > header { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: var(--s2); }
.panel > header h3 { margin: 0; font: var(--t-head); font-size: 12.5px; }
.panel > header .n { margin-left: auto; font: var(--t-num); font-size: 11px; color: var(--ink-3); }
.panel > .empty { padding: var(--s6) var(--s4); text-align: center; color: var(--ink-4); font: var(--t-sm); }

.attn {

}

.attn-s { display: block; font: var(--t-sm); font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

.guide-cell { background: var(--surface); padding: var(--s4) var(--s4) var(--s5); }

    <div class="ov-grid">

      <section class="panel">

    <!-- The Learn layer, present from first run rather than hidden behind Help. -->
    <section class="sec" style="margin-top:var(--s6)">
      <div class="panel">
        <header><h3>Three ideas this tool exists to express</h3><span class="n">New here?</span></header>
        <div class="guide">
          <div class="guide-cell">
            <div class="step">01</div>
            <h4>The filesystem is the truth</h4>
            <p>SQLite is a rebuildable index. Delete it any time &mdash; <code>db rebuild</code> restores it from
            what is actually on disk. Nothing you do here can make the disk disagree.</p>
            <button class="btn btn-ghost" style="height:24px;font-size:11.5px">Verify the index &rarr;</button>
          </div>
          <div class="guide-cell">
            <div class="step">02</div>
            <h4>A skill is a document, not a record</h4>
            <p>What an agent reads is <code>SKILL.md</code>. Copies are compared by content hash, so "same name"
            never implies "same instructions".</p>
            <button class="btn btn-ghost" style="height:24px;font-size:11.5px">Open a document &rarr;</button>
          </div>
          <div class="guide-cell">
            <div class="step">03</div>
            <h4>Precedence is evidence, not a guess</h4>
            <p>Where an agent documents its load order, you get a winner. Where it doesn't, you get
            <code>undocumented-precedence</code> &mdash; never an invented one.</p>
            <button class="btn btn-ghost" style="height:24px;font-size:11.5px">Run the diagnostic &rarr;</button>
          </div>
        </div>
      </div>
    </section>
  </div>`;

function setView(v){
  const isOv = v === 'overview';
  shell.classList.toggle('solo', isOv);
  pane.style.display = isOv ? 'none' : '';
  detail.innerHTML = isOv ? OVERVIEW : LIBRARY;
  document.querySelectorAll('.nav-i').forEach(b =>
    b.classList.toggle('on', b.dataset.view === v));
}

document.querySelectorAll('.nav-i').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('.scope').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.scope').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  }));
document.querySelectorAll('.row').forEach(r =>
  r.addEventListener('click', () => {
    document.querySelectorAll('.row').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-selected','false'); });
    r.classList.add('on'); r.setAttribute('aria-selected','true');
  }));

document.getElementById('btn-overview').addEventListener('click', () => setView('overview'));
document.getElementById('btn-theme').addEventListener('click', () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
});

setView(location.hash === '#library' ? 'library' : 'overview');

/* Capture mode: ?shot=1 relaxes the fixed-viewport shell so a full-page
   screenshot shows the whole screen instead of the first 577px of it.
   &view=<name> and &theme=<light|dark> open the prototype in a given state. */
{
  const q = new URLSearchParams(location.search);
  if (q.get('view')) setView(q.get('view'));
  if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  if (q.get('shot') === '1') {
    const st = document.createElement('style');
    st.textContent = `
      html,body{height:auto!important;overflow:visible!important}
      .shell{min-height:880px}
      .detail,.rows,.rail{overflow:visible!important}`;
    document.head.appendChild(st);
  }
}
</script>
</body>
